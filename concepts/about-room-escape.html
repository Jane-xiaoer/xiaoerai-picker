<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小耳奇物室 · 关于我(密室探索样稿)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece2c8; --paper-warm:#e3d2a8; --paper-deep:#c8b488; --paper-fold:#a18a5a; --paper-shadow:#8a6f3c;
  --ink:#2e1e10; --ink-soft:#4a2f18; --ink-faint:#6a4a28;
  --ink-red:#8a2a18; --ink-teal:#2a5a4a; --ink-gold:#8a6028;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0806;
  font-family:'EB Garamond','Cormorant Garamond',Georgia,serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
#app{position:fixed;inset:0}

/* ---------- shared stage look ---------- */
.stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(ellipse 82% 64% at 50% 46%,var(--paper) 0%,var(--paper-warm) 55%,var(--paper-deep) 100%);
  transition:filter 1.4s ease, transform 1.1s cubic-bezier(.6,.02,.2,1), opacity 1s ease;
  filter:brightness(.6) saturate(.72)}
.stage.lit{filter:brightness(1) saturate(1)}
.overlaytex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.9;
  background:
    repeating-linear-gradient(0deg,rgba(46,30,16,.035) 0 1px,transparent 1px 3px),
    radial-gradient(circle at 22% 30%,rgba(120,80,40,.10) 0 3px,transparent 4px),
    radial-gradient(circle at 68% 72%,rgba(120,80,40,.08) 0 2px,transparent 3px),
    radial-gradient(circle at 84% 24%,rgba(120,80,40,.09) 0 4px,transparent 5px)}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 62% at 50% 44%,transparent 40%,rgba(20,10,4,.30) 78%,rgba(10,6,2,.62) 100%)}

svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- engraving strokes ---------- */
.line{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.line.thin{stroke-width:1.4;stroke:var(--ink-soft)}
.fillpaper{fill:var(--paper)}
.fillwarm{fill:var(--paper-warm)}
.filldeep{fill:var(--paper-deep)}

/* ---------- interactive zones ---------- */
.zone{cursor:pointer}
.zone .hit{fill:transparent;stroke:none}
.zone .halo{opacity:0;transition:opacity .5s ease}
.stage.lit .zone:hover .halo{opacity:.55}
.zone .plate{opacity:0;transition:opacity .35s ease, transform .35s ease;transform:translateY(6px)}
.zone:hover .plate{opacity:1;transform:translateY(0)}
.zone .plate rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.zone .plate text{fill:var(--ink);font-family:'Special Elite',monospace}
.zone.found .dot{opacity:1}
.zone .dot{opacity:0}

/* ---------- title chrome ---------- */
.chrome{position:absolute;left:0;right:0;top:26px;text-align:center;pointer-events:none;z-index:5;
  opacity:0;transition:opacity 1s ease}
.chrome.show{opacity:1}
.chrome .t{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:38px;color:var(--ink);letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,250,235,.4)}
.chrome .sub{font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.42em;
  color:var(--ink-soft);margin-top:6px}
.rule{width:min(560px,70vw);height:1px;margin:12px auto 0;position:relative;
  background:linear-gradient(90deg,transparent,var(--ink-faint) 20%,var(--ink-faint) 80%,transparent)}

/* pull hint */
.pullhint{position:absolute;font-family:'Special Elite',monospace;font-size:11px;letter-spacing:.28em;
  color:var(--ink-soft);pointer-events:none;opacity:.0;transition:opacity .6s;white-space:nowrap}
.pullhint.show{opacity:.85}

/* ---------- counter ---------- */
.counter{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
  font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.24em;color:var(--ink-soft);
  opacity:0;transition:opacity .8s ease;text-align:center}
.counter.show{opacity:.9}
.counter b{color:var(--ink-red);font-weight:400}

/* back / index buttons */
.navbtn{position:absolute;z-index:7;font-family:'Special Elite',monospace;font-size:12px;
  letter-spacing:.22em;color:var(--ink-soft);background:var(--paper);border:1.4px solid var(--ink-faint);
  padding:8px 14px;cursor:pointer;border-radius:2px;opacity:0;transition:opacity .6s, background .2s, color .2s}
.navbtn.show{opacity:1}
.navbtn:hover{background:var(--ink);color:var(--paper)}
#back{left:26px;top:24px}
#toindex{right:26px;top:24px}

/* ---------- panel (bottom sheet) ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,10,4,.42);opacity:0;pointer-events:none;
  transition:opacity .4s ease;backdrop-filter:blur(1px)}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);z-index:21;
  width:min(760px,94vw);background:var(--paper);border:2px solid var(--ink);
  border-bottom:none;border-radius:10px 10px 0 0;padding:26px 30px 34px;
  box-shadow:0 -18px 60px rgba(10,6,2,.5);transition:transform .5s cubic-bezier(.6,.02,.2,1)}
.panel.open{transform:translate(-50%,0)}
.panel::before{content:"";position:absolute;left:50%;top:12px;transform:translateX(-50%);
  width:54px;height:5px;border-radius:3px;background:var(--paper-fold)}
.panel .roman{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--ink-red);letter-spacing:.1em}
.panel h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;margin:.15em 0 .1em;color:var(--ink)}
.panel .en{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:.34em;color:var(--ink-faint);margin-bottom:14px}
.panel .desc{font-size:16.5px;line-height:1.7;color:var(--ink-soft);max-width:60ch;margin-bottom:18px}
.panel .items{display:flex;flex-direction:column;gap:2px}
.panel a.item, .panel span.item{display:flex;align-items:baseline;gap:12px;text-decoration:none;
  padding:11px 8px;border-top:1px solid rgba(46,30,16,.16);color:var(--ink);transition:background .18s,padding-left .18s}
.panel a.item:hover{background:rgba(46,30,16,.06);padding-left:16px}
.panel .item .idx{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--ink-red);min-width:26px}
.panel .item .nm{font-family:'Noto Serif SC',serif;font-weight:500;font-size:17px}
.panel .item .u{font-family:'Special Elite',monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.04em;margin-left:auto}
.panel .item .soon{font-family:'Special Elite',monospace;font-size:10px;color:var(--paper);background:var(--ink-faint);
  padding:2px 7px;border-radius:2px;letter-spacing:.1em;margin-left:auto}
.panel .close{position:absolute;right:18px;top:16px;font-family:'Special Elite',monospace;font-size:11px;
  letter-spacing:.2em;color:var(--ink-faint);cursor:pointer;padding:6px 8px}
.panel .close:hover{color:var(--ink-red)}

/* intro hint */
.entryhint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;text-align:center;
  font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.22em;color:var(--ink-soft);
  opacity:0;transition:opacity 1s ease}
.entryhint.show{opacity:.8;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}

.credit{position:fixed;right:12px;bottom:8px;z-index:8;font-family:'Special Elite',monospace;
  font-size:9.5px;letter-spacing:.12em;color:rgba(46,30,16,.4)}
</style>
</head>
<body>
<div id="app">

  <!-- ============ SCENE: ENTRY (desk) ============ -->
  <div class="stage" id="entry">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
          <line x1="0" y1="0" x2="0" y2="7" stroke="#2e1e10" stroke-width="1" opacity=".5"/></pattern>
        <pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#2e1e10" stroke-width=".9" opacity=".4"/></pattern>
        <radialGradient id="lampglow" cx="50%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#f4d68a" stop-opacity=".9"/><stop offset="100%" stop-color="#f4d68a" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- table top -->
      <g filter="url(#rough)">
        <path class="line" d="M120 700 L1480 700" stroke-width="3"/>
        <path class="line thin" d="M120 712 L1480 712"/>
        <!-- books -->
        <g>
          <rect class="fillwarm" x="250" y="648" width="180" height="20"/><rect class="line" x="250" y="648" width="180" height="20"/>
          <rect class="fillpaper" x="262" y="628" width="156" height="22"/><rect class="line" x="262" y="628" width="156" height="22"/>
        </g>
        <!-- mug -->
        <g><path class="fillpaper" d="M470 640 h64 v52 a10 10 0 0 1 -10 10 h-44 a10 10 0 0 1 -10 -10 Z"/>
          <path class="line" d="M470 640 h64 v52 a10 10 0 0 1 -10 10 h-44 a10 10 0 0 1 -10 -10 Z"/>
          <path class="line" d="M534 652 a18 18 0 0 1 0 34"/>
          <rect x="482" y="648" width="40" height="6" fill="url(#hatch)"/></g>
      </g>

      <!-- lamp -->
      <g id="lampGroup" class="zone" filter="url(#rough)">
        <circle id="lampHalo" cx="1180" cy="330" r="250" fill="url(#lampglow)" opacity="0"/>
        <path class="fillpaper" d="M1090 250 L1270 250 L1250 350 L1110 350 Z"/><path class="line" d="M1090 250 L1270 250 L1250 350 L1110 350 Z"/>
        <path d="M1090 250 L1270 250 L1250 350 L1110 350 Z" fill="url(#hatch2)"/>
        <ellipse class="fillpaper" cx="1180" cy="250" rx="20" ry="6"/><ellipse class="line" cx="1180" cy="250" rx="20" ry="6"/>
        <rect class="fillpaper" x="1172" y="350" width="16" height="330"/><rect class="line" x="1172" y="350" width="16" height="330"/>
        <ellipse class="fillpaper" cx="1180" cy="686" rx="78" ry="13"/><ellipse class="line" cx="1180" cy="686" rx="78" ry="13"/>
        <!-- pull cord -->
        <line id="cord" class="line thin" x1="1250" y1="350" x2="1250" y2="470"/>
        <rect id="cordEnd" class="fillpaper" x="1242" y="470" width="16" height="26"/><rect class="line thin" x="1242" y="470" width="16" height="26"/>
      </g>

      <!-- cabinet / door : the way IN -->
      <g id="cabinet" class="zone" filter="url(#rough)">
        <rect class="halo" x="560" y="720" width="480" height="230" rx="8" fill="#f4d68a"/>
        <rect class="filldeep" x="580" y="740" width="440" height="210"/><rect class="line" x="580" y="740" width="440" height="210"/>
        <rect x="580" y="740" width="440" height="210" fill="url(#hatch)" opacity=".5"/>
        <rect class="line thin" x="600" y="760" width="400" height="170"/>
        <ellipse class="fillpaper" cx="800" cy="845" rx="52" ry="14"/><ellipse class="line" cx="800" cy="845" rx="52" ry="14"/>
        <ellipse class="line thin" cx="800" cy="845" rx="46" ry="10"/>
      </g>
    </svg>
    <div class="pullhint" id="pullhint" style="left:1280px;top:452px">← 拉一下 · pull</div>
    <div class="entryhint" id="entryhint">点开柜门,走进奇物室 · click the cabinet to enter</div>
  </div>

  <div class="chrome" id="entryChrome">
    <div class="t">Xiaoer's Desk</div>
    <div class="sub">PL. I — ARRANGEMENT</div>
    <div class="rule"></div>
  </div>

  <!-- ============ SCENE: THE ROOM ============ -->
  <div class="stage" id="room" style="opacity:0;pointer-events:none;transform:scale(1.25)">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="11" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
      </defs>

      <!-- wall / floor -->
      <path class="fillwarm" d="M0 0 H1600 V640 H0 Z"/>
      <path class="filldeep" d="M0 640 H1600 V1000 H0 Z"/>
      <g filter="url(#rough2)">
        <path class="line thin" d="M0 640 H1600"/>
        <path class="line thin" d="M0 668 H1600" opacity=".5"/>
        <!-- floorboards perspective -->
        <path class="line thin" d="M420 640 L120 1000" opacity=".35"/>
        <path class="line thin" d="M800 640 L800 1000" opacity=".35"/>
        <path class="line thin" d="M1180 640 L1480 1000" opacity=".35"/>
      </g>

      <!-- hanging lamp (room light) -->
      <g id="roomLamp" class="zone" filter="url(#rough2)">
        <circle id="roomHalo" cx="800" cy="240" r="300" fill="url(#lampglow)" opacity="0"/>
        <line class="line thin" x1="800" y1="0" x2="800" y2="120"/>
        <path class="fillpaper" d="M740 120 L860 120 L840 210 L760 210 Z"/><path class="line" d="M740 120 L860 120 L840 210 L760 210 Z"/>
        <path d="M740 120 L860 120 L840 210 L760 210 Z" fill="url(#hatch2)"/>
        <line id="roomCord" class="line thin" x1="840" y1="210" x2="840" y2="300"/>
        <rect class="fillpaper" x="832" y="300" width="16" height="24"/><rect class="line thin" x="832" y="300" width="16" height="24"/>
        <g class="plate"><rect x="770" y="336" width="120" height="26"/><text x="830" y="353" text-anchor="middle" font-size="11" letter-spacing="2">PULL · 点灯</text></g>
      </g>

      <!-- ===== ZONE: BOOKSHELF (网站群) ===== -->
      <g class="zone" data-key="sites">
        <rect class="halo" x="90" y="180" width="290" height="470" rx="6" fill="#f4d68a"/>
        <g filter="url(#rough2)">
          <rect class="fillpaper" x="110" y="200" width="250" height="440"/><rect class="line" x="110" y="200" width="250" height="440"/>
          <path class="line thin" d="M110 310 H360 M110 420 H360 M110 530 H360"/>
          <!-- books row 1 -->
          <g><rect class="fillwarm" x="126" y="222" width="26" height="84"/><rect class="line thin" x="126" y="222" width="26" height="84"/>
             <rect class="filldeep" x="156" y="230" width="22" height="76"/><rect class="line thin" x="156" y="230" width="22" height="76"/>
             <rect class="fillpaper" x="182" y="218" width="30" height="88"/><rect class="line thin" x="182" y="218" width="30" height="88"/>
             <rect x="182" y="218" width="30" height="88" fill="url(#hatch)" opacity=".4"/>
             <rect class="fillwarm" x="216" y="226" width="24" height="80"/><rect class="line thin" x="216" y="226" width="24" height="80"/>
             <path class="filldeep" d="M246 306 L330 306 L322 232 L254 238 Z"/><path class="line thin" d="M246 306 L330 306 L322 232 L254 238 Z"/></g>
          <!-- books row 2 -->
          <g><rect class="filldeep" x="126" y="332" width="30" height="86"/><rect class="line thin" x="126" y="332" width="30" height="86"/>
             <rect class="fillpaper" x="160" y="338" width="24" height="80"/><rect class="line thin" x="160" y="338" width="24" height="80"/>
             <rect class="fillwarm" x="188" y="330" width="28" height="88"/><rect class="line thin" x="188" y="330" width="28" height="88"/>
             <rect class="fillpaper" x="220" y="336" width="26" height="82"/><rect class="line thin" x="220" y="336" width="26" height="82"/>
             <rect x="220" y="336" width="26" height="82" fill="url(#hatch2)" opacity=".4"/>
             <rect class="fillwarm" x="250" y="332" width="30" height="86"/><rect class="line thin" x="250" y="332" width="30" height="86"/></g>
          <!-- books row 3 (leaning) -->
          <g><rect class="fillpaper" x="126" y="446" width="28" height="80"/><rect class="line thin" x="126" y="446" width="28" height="80"/>
             <rect class="fillwarm" x="158" y="442" width="26" height="84"/><rect class="line thin" x="158" y="442" width="26" height="84"/>
             <path class="filldeep" d="M190 526 L214 526 L226 448 L202 444 Z"/><path class="line thin" d="M190 526 L214 526 L226 448 L202 444 Z"/>
             <rect class="fillpaper" x="238" y="450" width="28" height="76"/><rect class="line thin" x="238" y="450" width="28" height="76"/></g>
        </g>
        <g class="plate"><rect x="150" y="150" width="170" height="30"/><text x="235" y="170" text-anchor="middle" font-size="12" letter-spacing="2.5">书架 · SITES</text></g>
        <circle class="dot" cx="360" cy="192" r="6" fill="var(--ink-red)"/>
      </g>

      <!-- ===== ZONE: PORTRAIT (关于我) ===== -->
      <g class="zone" data-key="about">
        <rect class="halo" x="470" y="150" width="230" height="300" rx="8" fill="#f4d68a"/>
        <g filter="url(#rough2)">
          <rect class="fillpaper" x="490" y="170" width="190" height="250"/><rect class="line" x="490" y="170" width="190" height="250" stroke-width="4"/>
          <rect class="line thin" x="506" y="186" width="158" height="218"/>
          <!-- silhouette portrait -->
          <path class="filldeep" d="M585 210 a52 52 0 0 1 52 52 v0 c0 40 -30 74 -52 74 s-52 -34 -52 -74 a52 52 0 0 1 52 -52 Z"/>
          <path class="line thin" d="M585 210 a52 52 0 0 1 52 52 c0 40 -30 74 -52 74 s-52 -34 -52 -74 a52 52 0 0 1 52 -52 Z"/>
          <path class="filldeep" d="M520 404 c8 -52 40 -74 65 -74 s57 22 65 74 Z"/><path class="line thin" d="M520 404 c8 -52 40 -74 65 -74 s57 22 65 74"/>
          <rect x="506" y="330" width="158" height="74" fill="url(#hatch)" opacity=".3"/>
        </g>
        <g class="plate"><rect x="500" y="128" width="170" height="30"/><text x="585" y="148" text-anchor="middle" font-size="12" letter-spacing="2.5">肖像 · ABOUT</text></g>
        <circle class="dot" cx="680" cy="162" r="6" fill="var(--ink-red)"/>
      </g>

      <!-- ===== ZONE: CHEST OF DRAWERS (四个房间) ===== -->
      <g class="zone" data-key="rooms">
        <rect class="halo" x="600" y="470" width="380" height="240" rx="8" fill="#f4d68a"/>
        <g filter="url(#rough2)">
          <rect class="fillwarm" x="620" y="486" width="340" height="224"/><rect class="line" x="620" y="486" width="340" height="224"/>
          <!-- 4 drawers -->
          <g id="drawGrp">
            <g class="drw"><rect class="fillpaper" x="636" y="500" width="308" height="46"/><rect class="line thin" x="636" y="500" width="308" height="46"/>
              <circle class="fillwarm" cx="790" cy="523" r="9"/><circle class="line thin" cx="790" cy="523" r="9"/></g>
            <g class="drw"><rect class="fillpaper" x="636" y="552" width="308" height="46"/><rect class="line thin" x="636" y="552" width="308" height="46"/>
              <circle class="fillwarm" cx="790" cy="575" r="9"/><circle class="line thin" cx="790" cy="575" r="9"/></g>
            <g class="drw"><rect class="fillpaper" x="636" y="604" width="308" height="46"/><rect class="line thin" x="636" y="604" width="308" height="46"/>
              <circle class="fillwarm" cx="790" cy="627" r="9"/><circle class="line thin" cx="790" cy="627" r="9"/></g>
            <g class="drw"><rect class="fillpaper" x="636" y="656" width="308" height="46"/><rect class="line thin" x="636" y="656" width="308" height="46"/>
              <circle class="fillwarm" cx="790" cy="679" r="9"/><circle class="line thin" cx="790" cy="679" r="9"/></g>
          </g>
        </g>
        <g class="plate"><rect x="700" y="446" width="200" height="30"/><text x="800" y="466" text-anchor="middle" font-size="12" letter-spacing="2.5">柜屉 · FOUR ROOMS</text></g>
        <circle class="dot" cx="960" cy="478" r="6" fill="var(--ink-red)"/>
      </g>

      <!-- ===== ZONE: PHONOGRAPH (小耳FM) ===== -->
      <g class="zone" data-key="fm">
        <rect class="halo" x="1130" y="470" width="330" height="250" rx="8" fill="#f4d68a"/>
        <g filter="url(#rough2)">
          <!-- table -->
          <rect class="filldeep" x="1170" y="620" width="250" height="16"/><rect class="line" x="1170" y="620" width="250" height="16"/>
          <path class="line" d="M1188 636 L1176 710 M1402 636 L1414 710"/>
          <!-- box base -->
          <rect class="fillpaper" x="1210" y="560" width="170" height="62"/><rect class="line" x="1210" y="560" width="170" height="62"/>
          <rect x="1210" y="560" width="170" height="62" fill="url(#hatch2)" opacity=".3"/>
          <!-- disc -->
          <ellipse class="filldeep" cx="1290" cy="560" rx="82" ry="24"/><ellipse class="line" cx="1290" cy="560" rx="82" ry="24"/>
          <ellipse class="line thin" cx="1290" cy="560" rx="54" ry="15"/><circle class="fillpaper" cx="1290" cy="560" r="6"/><circle class="line thin" cx="1290" cy="560" r="6"/>
          <!-- horn -->
          <path class="fillpaper" d="M1360 552 q60 -18 92 -78 q6 40 -18 78 q-30 30 -74 22 Z"/>
          <path class="line" d="M1360 552 q60 -18 92 -78 q6 40 -18 78 q-30 30 -74 22 Z"/>
          <line class="line thin" x1="1360" y1="540" x2="1360" y2="500"/>
        </g>
        <g class="plate"><rect x="1210" y="446" width="210" height="30"/><text x="1315" y="466" text-anchor="middle" font-size="12" letter-spacing="2.5">留声机 · 小耳FM</text></g>
        <circle class="dot" cx="1440" cy="478" r="6" fill="var(--ink-red)"/>
      </g>

<script>
/* ---------------- real content (edit freely) ---------------- */
const DATA = {

      {idx:'III',nm:'百物匣 · Curio Box',u:'store.xiaoerai.xyz',href:'https://store.xiaoerai.xyz'},
      {idx:'IV',nm:'鲁班箱 · Luban Box',u:'workbox.xiaoerai.xyz',href:'https://workbox.xiaoerai.xyz'},

  fm:{roman:'小耳FM',title:'留声机',en:'THE PHONOGRAPH',
    desc:'摇一下,放一首。1058 首豆瓣红心,一座会画画的音乐馆。',
    items:[
      {nm:'小耳FM · 音乐馆',u:'fm.xiaoercamera.xyz',href:'https://fm.xiaoercamera.xyz'},
      {nm:'能找到我 · 3D 星图',u:'fm.xiaoercamera.xyz/me',href:'https://fm.xiaoercamera.xyz/me'},
    ]},
  contact:{roman:'找到我',title:'信匣',en:'CORRESPONDENCE',
    desc:'想寄封信、想织张网、想在别处遇见我 —— 都在这几只信袋里。',

      {nm:'X · @xiaoerzhan',u:'x.com/xiaoerzhan',href:'https://x.com/xiaoerzhan'},

    ]},

/* ---------------- scene transitions ---------------- */
const entry=document.getElementById('entry'), room=document.getElementById('room');
const entryChrome=document.getElementById('entryChrome'), roomChrome=document.getElementById('roomChrome');
const counter=document.getElementById('counter'), back=document.getElementById('back'), toindex=document.getElementById('toindex');
let entryLit=false, inRoom=false;

function litEntry(){ if(entryLit)return; entryLit=true; entry.classList.add('lit');
  document.getElementById('lampHalo').style.opacity='1'; document.getElementById('cordEnd').style.transform='translateY(8px)';
  document.getElementById('pullhint').classList.remove('show');
  setTimeout(()=>document.getElementById('entryhint').classList.add('show'),700);
}
document.getElementById('lampGroup').addEventListener('click',litEntry);
setTimeout(()=>{entryChrome.classList.add('show');},400);
setTimeout(()=>{document.getElementById('pullhint').classList.add('show');},1400);

document.getElementById('cabinet').addEventListener('click',enterRoom);
function enterRoom(){
  if(!entryLit)litEntry();
  inRoom=true;
  entry.style.transform='scale(1.9)'; entry.style.opacity='0'; entry.style.pointerEvents='none';
  entryChrome.classList.remove('show');
  room.style.opacity='1'; room.style.pointerEvents='auto'; room.style.transform='scale(1)';
  setTimeout(()=>{ room.classList.add('lit'); document.getElementById('roomHalo').style.opacity='1';
    roomChrome.classList.add('show'); counter.classList.add('show');
    back.classList.add('show'); toindex.classList.add('show'); },600);
}
function exitRoom(){
  inRoom=false; closePanel();
  room.style.opacity='0'; room.style.pointerEvents='none'; room.style.transform='scale(1.25)';
  room.classList.remove('lit'); roomChrome.classList.remove('show'); counter.classList.remove('show');
  back.classList.remove('show'); toindex.classList.remove('show');
  entry.style.transform='scale(1)'; entry.style.opacity='1'; entry.style.pointerEvents='auto';
  setTimeout(()=>entryChrome.classList.add('show'),400);
}
back.addEventListener('click',exitRoom);
toindex.addEventListener('click',()=>window.open('https://tools.xiaoerai.xyz/me','_blank'));
document.getElementById('roomLamp').addEventListener('click',()=>{
  room.classList.toggle('lit'); const h=document.getElementById('roomHalo');
  h.style.opacity = h.style.opacity==='1' ? '.4' : '1';
});

/* ---------------- discovery + panel ---------------- */
const found=new Set();
function markFound(key,el){ if(found.has(key))return; found.add(key); el.classList.add('found');
  document.getElementById('cfound').textContent=found.size;
  if(found.size===6){ counter.innerHTML='六处机关皆已寻得 · 奇物室已通透 ✦'; }
}
document.querySelectorAll('.zone[data-key]').forEach(z=>{
  z.addEventListener('click',()=>{ const k=z.dataset.key; markFound(k,z); openPanel(k); });
});

const scrim=document.getElementById('scrim'), panel=document.getElementById('panel');
function openPanel(key){
  const d=DATA[key]; if(!d)return;
  document.getElementById('proman').textContent=d.roman;
  document.getElementById('ptitle').textContent=d.title;
  document.getElementById('pen').textContent=d.en;
  document.getElementById('pdesc').textContent=d.desc;
  const box=document.getElementById('pitems'); box.innerHTML='';
  d.items.forEach((it,i)=>{
    const idx = it.idx || String(i+1).padStart(2,'0');
    if(it.soon){
      const s=document.createElement('span'); s.className='item';
      s.innerHTML=`<span class="idx">${idx}</span><span class="nm">${it.nm}</span><span class="soon">${it.u}</span>`;
      box.appendChild(s);
    }else{
      const a=document.createElement('a'); a.className='item'; a.href=it.href; a.target='_blank'; a.rel='noopener';
      a.innerHTML=`<span class="idx">${idx}</span><span class="nm">${it.nm}</span><span class="u">${it.u} ↗</span>`;
      box.appendChild(a);
    }
  });
  scrim.classList.add('open'); panel.classList.add('open');
}
function closePanel(){ scrim.classList.remove('open'); panel.classList.remove('open'); }
scrim.addEventListener('click',closePanel);
document.getElementById('pclose').addEventListener('click',closePanel);
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(panel.classList.contains('open'))closePanel(); else if(inRoom)exitRoom(); }});
</script>

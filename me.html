<style>
:root{--paper:#f2ead4;--warm:#e8dcbb;--ink:#2e1e10;--soft:#4a2f18;--faint:#7a5a34;--red:#8a2a18;--gold:#8a6028;--teal:#2a5a4a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#efe6cf;font-family:'Noto Serif SC',serif;-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 80% at 50% 46%,#efe6cf,#d8c8a0)}
.wrap{position:relative;width:min(100vw,149vh);aspect-ratio:2528/1696}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;filter:saturate(1) brightness(1.04)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 82% 80% at 50% 48%,transparent 60%,rgba(80,55,25,.14) 100%)}
.layer{position:absolute;inset:0;transition:transform .4s ease-out}

/* the WORLD title */
.worldtitle{position:absolute;left:50%;top:5.5%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity 1s ease}
.worldtitle .z{font-family:'Noto Serif SC',serif;font-weight:700;font-size:clamp(12px,1.28vw,20px);color:var(--ink);letter-spacing:.06em}
.worldtitle.en .z{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(14px,1.5vw,24px);letter-spacing:.02em}
.worldtitle .e{font-family:'Special Elite',monospace;font-size:clamp(7px,.62vw,10px);letter-spacing:.3em;color:var(--soft);margin-top:3px}

/* region headers */
.rhead{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .85s ease}
.rhead .z{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(15px,1.7vw,27px);color:var(--soft)}
.rhead .e{font-family:'Special Elite',monospace;font-size:clamp(8px,.7vw,11px);letter-spacing:.26em;color:var(--faint);margin-top:1px}
.rhead::after{content:"";display:block;width:52px;height:2px;margin:5px auto 0;background:var(--soft);opacity:.7;filter:url(#rough2)}

/* labels are WRITTEN ONTO the map — engraved place-names, no boxes: soft edgeless paper halo + hand-drawn underline */
.plaque{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;cursor:pointer;padding:6px 15px;
  background:radial-gradient(ellipse 62% 64% at 50% 50%,rgba(243,236,216,.92) 34%,rgba(243,236,216,.6) 60%,rgba(243,236,216,0) 80%);
  transition:transform .34s cubic-bezier(.34,1.4,.4,1), opacity .85s ease}
.plaque::before{content:"";position:absolute;inset:-16px;z-index:-1;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(244,214,138,.55),rgba(244,214,138,0) 68%);opacity:0;transition:opacity .45s ease}
.plaque:hover::before{opacity:1}
.plaque .zh{font-family:'Noto Serif SC',serif;font-weight:700;font-size:clamp(12px,1.2vw,18px);color:var(--ink);line-height:1.15;
  letter-spacing:.02em;text-shadow:0 0 4px var(--paper),0 0 2px var(--paper),0 1px 1px var(--paper)}
.plaque.en .zh{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;letter-spacing:.01em}
.plaque .rule{height:2px;width:64%;margin:3px auto 2px;background:var(--ink);opacity:.6;filter:url(#rough)}
.plaque .sub{font-family:'Noto Serif SC',serif;font-weight:500;font-size:clamp(9px,.82vw,12.5px);color:var(--soft);letter-spacing:.02em;
  text-shadow:0 0 4px var(--paper),0 0 2px var(--paper),0 1px 1px var(--paper)}
.plaque.en .sub{font-family:'EB Garamond','Cormorant Garamond',serif;font-size:clamp(9px,.84vw,13px)}
.plaque:hover{transform:translate(-50%,calc(-50% - 3px));z-index:50}
.plaque:hover .zh{color:var(--red)}
.plaque:hover .rule{opacity:.9;width:82%;background:var(--red)}
.plaque.cat-museum:hover .zh{color:var(--teal)} .plaque.cat-museum:hover .rule{background:var(--teal)}
.plaque.cat-work:hover .zh{color:var(--gold)} .plaque.cat-work:hover .rule{background:var(--gold)}
.plaque.big{padding:8px 22px}
.plaque.big .zh{font-size:clamp(16px,1.7vw,26px)}
.plaque.big .rule{width:78%;height:2.4px}
.plaque.big .sub{font-size:clamp(10px,.9vw,14px)}
.plaque.mid{padding:7px 19px}
.plaque.mid .zh{font-size:clamp(14px,1.5vw,23px)}
.plaque.mid .rule{width:74%;height:2.2px}
.plaque.mid .sub{font-size:clamp(9.5px,.86vw,13px)}
.plaque.sm{padding:5px 11px}
.plaque.sm .zh{font-size:clamp(11px,1.02vw,15px)}
.plaque.sm .rule{width:56%}
.plaque.sm .sub{font-size:clamp(8px,.72vw,11px)}
.plaque.noclick{cursor:default}
.plaque.noclick:hover .zh{color:var(--ink)} .plaque.noclick:hover .rule{background:var(--ink);opacity:.6;width:64%}
.plaque .bio-preview{position:absolute;left:50%;top:calc(100% + 8px);width:min(360px,78vw);padding:12px 15px;
  transform:translate(-50%,7px);opacity:0;visibility:hidden;pointer-events:none;white-space:normal;text-align:left;
  color:var(--ink);font-family:'Noto Serif SC',serif;font-size:clamp(10px,.78vw,12px);font-weight:500;line-height:1.75;
  background:rgba(242,234,212,.97);border:1px solid rgba(74,47,24,.5);box-shadow:0 8px 22px rgba(55,35,12,.2);
  transition:opacity .25s ease,transform .25s ease,visibility .25s ease}
.plaque .bio-preview::before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;
  transform:translateX(-50%) rotate(45deg);background:#f2ead4;border-left:1px solid rgba(74,47,24,.5);border-top:1px solid rgba(74,47,24,.5)}
.plaque.has-preview:hover .bio-preview,.plaque.has-preview:focus-visible .bio-preview{
  opacity:1;visibility:visible;transform:translate(-50%,0)}
.plaque:focus-visible{outline:2px solid var(--red);outline-offset:4px}

/* 扫码浮层 —— Notion 那行传了二维码的账号(现在是公众号)点开就是它。
   别加 backdrop-filter:Chromium 会另起合成根,把纸卡渲染成半透明(实测踩过) */
.qr-veil{position:fixed;inset:0;z-index:60;background:rgba(28,17,8,.62);
  display:none;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .3s ease}
.qr-veil.show{display:flex;opacity:1}
.qr-leaf{position:relative;width:min(310px,86vw);text-align:center;color:var(--ink);
  background:linear-gradient(178deg,#f4edd8 0%,var(--paper) 46%,var(--warm) 100%);
  border:1px solid rgba(74,47,24,.55);box-shadow:0 20px 54px rgba(38,22,8,.44);
  padding:26px 26px 20px;transform:translateY(14px) rotate(-.35deg);transition:transform .38s cubic-bezier(.2,1,.3,1)}
.qr-veil.show .qr-leaf{transform:rotate(-.35deg)}
.qr-leaf::after{content:"";position:absolute;inset:5px;border:1px solid rgba(74,47,24,.28);pointer-events:none;filter:url(#rough)}
.qr-leaf .qx{position:absolute;top:-13px;right:-13px;width:30px;height:30px;border-radius:50%;cursor:pointer;
  background:var(--paper);border:1px solid rgba(74,47,24,.6);color:var(--soft);
  font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1;transition:.25s}
.qr-leaf .qx:hover{color:var(--red);border-color:var(--red);transform:rotate(90deg)}
.qr-leaf .qk{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint)}
.qr-leaf .qt{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;letter-spacing:.03em;margin-top:7px}
.qr-leaf .qr-rule{height:2px;width:52px;margin:7px auto 0;background:var(--soft);opacity:.7;filter:url(#rough2)}
.qr-leaf .qs{font-family:'Noto Serif SC',serif;font-weight:500;font-size:12px;color:var(--soft);margin-top:7px}
.qr-leaf .qi{display:block;width:188px;height:188px;margin:16px auto 0;background:#fbf6e8;
  border:1px solid rgba(74,47,24,.45);padding:8px}
.qr-leaf .qp{font-family:'Noto Serif SC',serif;font-weight:600;font-size:12.5px;margin-top:14px}
.qr-leaf .ql{display:inline-block;margin-top:8px;font-family:'Cormorant Garamond',serif;font-size:13px;
  color:var(--faint);text-decoration:none;border-bottom:1px solid rgba(122,90,52,.4);padding-bottom:1px;transition:.25s}
.qr-leaf .ql:hover{color:var(--red);border-bottom-color:var(--red)}

/* site-wide language toggle — engraved pill; pref shared across the whole site via localStorage */
.langtoggle{position:fixed;left:12px;top:11px;z-index:9;display:flex;align-items:stretch;
  border:1.6px solid var(--ink);border-radius:20px;overflow:hidden;background:rgba(243,236,216,.9);
  box-shadow:0 2px 9px rgba(60,40,15,.2);font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.1em;cursor:pointer}
.langtoggle b{min-width:40px;height:26px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:400;line-height:1;color:var(--soft);transition:background .25s ease,color .25s ease;user-select:none}
.langtoggle b:first-child{border-right:1.4px solid var(--ink)}
/* 返回主页 —— 纯手写体墨字 + 箭头,不套方块 */
.homelink{position:fixed;left:118px;top:12px;z-index:9;text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  font-family:'Cormorant Garamond','Noto Serif SC',serif;font-style:italic;font-weight:600;font-size:15px;
  color:var(--soft);letter-spacing:.02em;text-shadow:0 0 6px var(--paper),0 0 3px var(--paper),0 1px 1px var(--paper);
  transition:color .25s ease,transform .25s ease}
.homelink .ar{font-family:'Special Elite',monospace;font-style:normal;font-size:14px}
.homelink:hover{color:var(--red);transform:translateX(-2px)}
.langtoggle b.on{background:var(--ink);color:var(--paper)}
.langtoggle b:not(.on):hover{background:rgba(46,30,16,.1)}

.credit{position:fixed;right:10px;top:8px;z-index:6;font-family:'Special Elite',monospace;font-size:9px;letter-spacing:.1em;color:rgba(74,47,24,.5)}
.help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;pointer-events:none;font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.16em;color:rgba(74,47,24,.6);text-align:center}
.maplinks{position:fixed;right:12px;top:12px;z-index:9;display:flex;gap:14px;font-family:'Special Elite','Noto Serif SC',monospace;font-size:10px;letter-spacing:.06em}
.maplinks a{color:var(--soft);text-underline-offset:3px}
@media (hover:none),(max-width:700px){
  .plaque .bio-preview{display:none}
  .maplinks{top:auto;right:10px;bottom:9px;gap:10px;font-size:9px}
  .help{display:none}
}
/* ── 竖屏手机 ──
   病根:.wrap 按「宽」装屏(min(100vw,149vh)) → 390px 宽的手机上地图只剩 262px 高、
   比原图缩了 6.5 倍;可标签字号 clamp 的下限把字托在 12px 不跟着缩,文字相对地图就放大了 6 倍多,
   于是叠成一团、冲出图外。改成按「高」装屏 —— 地图缩放比回到和桌面一致(0.46 vs 0.53),
   文字自然不再打架;代价是要横向拖着看,反而更像在看一张真地图。字号一并换成 vh,跟着地图等比。*/
@media (max-width:700px) and (orientation:portrait){
  .wrap{width:auto;height:92vh;will-change:transform}
  .worldtitle .z{font-size:clamp(11px,1.87vh,20px)}
  .worldtitle.en .z{font-size:clamp(12px,2.1vh,24px)}
  .worldtitle .e{font-size:clamp(6.5px,.95vh,10px)}
  .rhead .z{font-size:clamp(13px,2.5vh,27px)}
  .rhead .e{font-size:clamp(7px,1.05vh,11px)}
  .plaque .zh{font-size:clamp(11px,1.76vh,18px)}
  .plaque .sub{font-size:clamp(8px,1.2vh,12.5px)}
  .plaque.big .zh{font-size:clamp(15px,2.5vh,26px)}
  .plaque.big .sub{font-size:clamp(9px,1.32vh,14px)}
  .plaque.mid .zh{font-size:clamp(13px,2.2vh,23px)}
  .plaque.mid .sub{font-size:clamp(8.5px,1.26vh,13px)}
  .plaque.sm .zh{font-size:clamp(10px,1.5vh,15px)}
  .plaque.sm .sub{font-size:clamp(7.5px,1.06vh,11px)}
  /* 抬到右下角那排链接上面,并锁一行 —— 不然「点地名前往」会断行、还和链接叠一起 */
  .help{display:block;bottom:calc(34px + env(safe-area-inset-bottom));font-size:9.5px;letter-spacing:.06em;
    white-space:nowrap;background:rgba(242,234,212,.78);padding:5px 13px;border-radius:20px;transition:opacity .5s}
  .help.gone{opacity:0}
  #stage{touch-action:none}
}

const T={
  zh:{ title:'小耳的世界 · 复古地图', world:'小耳的世界', worldSub:'THE WORLD OF XIAOER', help:'每一处都是我做的一件事 · 点它前往', helpMobile:'拖动看全图 · 双指缩放 · 点地名前往', home:'返回主页', htmlLang:'zh-CN' },
  en:{ title:'The World of Xiaoer · A Vintage Map', world:'The World of Xiaoer', worldSub:'小 耳 的 世 界', help:'every place is something I made · click to visit', helpMobile:'drag to explore · pinch to zoom · tap a place', home:'Back Home', htmlLang:'en' },
};

const LS_KEY='xe-lang';            // shared site-wide language preference
let LANG=(localStorage.getItem(LS_KEY)==='en')?'en':'zh';
const NETWORK_API='https://tools.xiaoerai.xyz/api/me-network';

const layer=document.getElementById('layer');
const helpEl=document.getElementById('help');
const toggle=document.getElementById('langtoggle');

/* 扫码浮层：地名带 qr（Notion 那行传了二维码）就点开它，不跳走 */
const qrVeil=document.getElementById('qrVeil');
const QR_TOUCH=matchMedia('(hover:none)').matches;
let qrNode=null;
function openQr(p){
  qrNode=p;
  const en=(LANG==='en');
  document.getElementById('qrKick').textContent=en?'Scan to follow':'扫码关注';
  document.getElementById('qrTitle').textContent=en?(p.en||p.zh):p.zh;
  document.getElementById('qrSub').textContent=en?(p.subEn||''):(p.sub||'');
  const img=document.getElementById('qrImg');
  img.src=p.qr; img.alt=(en?(p.en||p.zh):p.zh)+(en?' QR code':' 二维码');
  document.getElementById('qrTip').textContent=QR_TOUCH
    ? (en?'Press and hold to recognise':'长按识别二维码')
    : (en?'Open WeChat and scan':'打开微信 · 扫一扫');
  const a=document.getElementById('qrLink');
  if(p.url){ a.href=p.url; a.textContent=en?'or read an article ↗':'或读一篇文章 ↗'; a.style.display=''; }
  else a.style.display='none';
  qrVeil.classList.add('show');
}
function closeQr(){ qrVeil.classList.remove('show'); qrNode=null; }
document.getElementById('qrClose').addEventListener('click',closeQr);
qrVeil.addEventListener('click',e=>{ if(e.target===qrVeil) closeQr(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') closeQr(); });

function build(){
  layer.innerHTML='';
  const t=T[LANG], en=(LANG==='en');
  if(qrNode && qrVeil.classList.contains('show')) openQr(qrNode); // 切语言时浮层文案跟着换
  // world title
  const wt=document.createElement('div');
  wt.className='worldtitle'+(en?' en':'');wt.style.left='84.2%';wt.style.top='86.1%';
  wt.innerHTML='<div class="z">'+t.world+'</div><div class="e">'+t.worldSub+'</div>';
  layer.appendChild(wt);
  // region headers
  HEADS.forEach(h=>{const d=document.createElement('div');d.className='rhead'+(en?' en':'');
    d.style.left=h.x+'%';d.style.top=h.y+'%';
    const name=en?h.zEn:h.z;
    d.innerHTML='<div class="z">'+name+(h.url?' <span style="font-size:.6em;opacity:.5">↗</span>':'')+'</div><div class="e">'+h.e+'</div>';
    if(h.url){d.style.pointerEvents='auto';d.style.cursor='pointer';d.addEventListener('click',()=>window.open(h.url,'_blank','noopener'));}
    layer.appendChild(d);});
  // place labels
  P.forEach(p=>{const d=document.createElement('div');
    const preview=en?p.hoverEn:p.hover;
    d.className='plaque cat-'+p.cat+(en?' en':'')+(p.big?' big':'')+(p.mid?' mid':'')+(p.sm?' sm':'')+((p.url||p.qr)?'':' noclick')+(preview?' has-preview':'');
    d.style.left=p.x+'%';d.style.top=p.y+'%';
    const name=en?p.en:p.zh, sub=en?p.subEn:p.sub;
    const mark=p.qr?'▣':(p.url?'↗':'');   // ▣ = 这处是扫码，不是跳走
    d.innerHTML='<div class="zh">'+escapeHtml(name)+(mark?' <span style="font-size:.72em;opacity:.5">'+mark+'</span>':'')+'</div><div class="rule"></div><div class="sub">'+escapeHtml(sub)+'</div>'+(preview?'<div class="bio-preview" role="tooltip">'+escapeHtml(preview)+'</div>':'');
    if(p.url||p.qr){
      d.tabIndex=0;d.setAttribute('role','link');
      const open=()=>p.qr?openQr(p):(p.url.startsWith('/')?(window.location.href=p.url):window.open(p.url,'_blank','noopener'));
      d.addEventListener('click',open);
      d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    }
    layer.appendChild(d);});
  // chrome
  helpEl.textContent=(window.__panMap && t.helpMobile) ? t.helpMobile : t.help;
  document.querySelector('#homelink .tx').textContent=t.home;
  document.title=t.title;
  document.documentElement.lang=t.htmlLang;
  toggle.querySelectorAll('b').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
}

function escapeHtml(value){
  return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function firstField(node,names){
  for(const name of names){const value=node&&node[name];if(typeof value==='string'&&value.trim())return value.trim();}
  return '';
}

function flatten(node,out=[]){
  if(!node||typeof node!=='object')return out;
  out.push(node);
  (node.children||[]).forEach(child=>flatten(child,out));
  return out;
}

function comparable(url){
  if(!url)return '';
  try{const u=new URL(url,location.origin);return (u.hostname+u.pathname).replace(/\/$/,'').toLowerCase();}
  catch{return String(url).replace(/^https?:\/\//,'').replace(/\/$/,'').toLowerCase();}
}

function applyNetworkData(root){
  const nodes=flatten(root);
  const center=nodes.find(n=>n.type==='center'||firstField(n,['地图角色','mapRole'])==='中心节点');
  if(center){
    const display=firstField(center,['地图显示文案','mapDisplayText','displayText']);
    const hover=firstField(center,['悬停文案','hoverText','hover']);
    const englishHover=firstField(center,['hoverTextEn','hoverEn']);
    if(display){
      const lines=display.split(/\n|｜/).map(x=>x.trim()).filter(Boolean);
      if(lines[0])P[0].zh=lines[0];
      if(lines[1]&&lines[1].includes('AI Artist'))P[0].sub=P[0].subEn=lines[1];
    }
    if(hover)P[0].hover=hover;
    if(englishHover)P[0].hoverEn=englishHover;
  }
  P.slice(1).forEach(place=>{
    const key=comparable(place.url);
    if(!key)return;
    const node=nodes.find(n=>comparable(n.href||n.url)===key);
    if(!node)return;
    place.zh=firstField(node,['label','展示名'])||place.zh;
    place.en=firstField(node,['en','英文名'])||place.en;
    place.sub=firstField(node,['sub','短介绍','定位（一句话）'])||place.sub;
    place.subEn=firstField(node,['ens','subEn'])||place.subEn;
    place.url=node.href||node.url||place.url;
    if(node.qr)place.qr=node.qr; // Notion 那行传了二维码 → 这个地名改成扫码，不跳走
  });
  build();
}

// entrance: center-out bloom (base stays visible; gated on visibility so it can never stick transparent)
function bloomIn(){
  if(!Element.prototype.animate) return;
  [...layer.querySelectorAll('.plaque,.rhead,.worldtitle')].forEach(el=>{
    const cx=parseFloat(el.style.left)||50, cy=parseFloat(el.style.top)||45;
    const d=Math.hypot(cx-48,cy-42);
    el.animate([{opacity:0},{opacity:1}], {duration:760, delay:220+d*15, easing:'ease', fill:'backwards'});
  });
}

function setLang(l,animate){
  if(l===LANG && animate!=='force') { }   // still rebuild on first paint
  LANG=l; localStorage.setItem(LS_KEY,l);
  build();
  if(animate==='fade' && Element.prototype.animate){ layer.animate([{opacity:0},{opacity:1}],{duration:280,easing:'ease'}); }
}

toggle.querySelectorAll('b').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.lang!==LANG) setLang(b.dataset.lang,'fade'); }));
// react if another tab / the main site flips the shared preference
addEventListener('storage',e=>{ if(e.key===LS_KEY && (e.newValue==='zh'||e.newValue==='en') && e.newValue!==LANG) setLang(e.newValue,'fade'); });

// ── 竖屏手机:地图按高铺满(见上面那段 CSS 注释),所以要能拖着看 ──
// 单指拖动平移 / 双指捏合缩放 / 轻点地名照常前往(拖过的那一下不算点击)
window.__panMap = matchMedia('(max-width:700px) and (orientation:portrait)').matches;
if(window.__panMap){
  const stage=document.getElementById('stage'), wrapEl=document.getElementById('wrap');
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  let tx=0,ty=0,sc=1, ox=0,oy=0, mode=0, d0=1, sc0=1, moved=false, upAt=0;
  const apply=()=>{ wrapEl.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; };
  const bound=()=>{ // 别把地图拖出屏幕:平移范围就是「地图比屏幕大出来的那一半」
    const mx=Math.max(0,(wrapEl.offsetWidth*sc-innerWidth)/2),
          my=Math.max(0,(wrapEl.offsetHeight*sc-innerHeight)/2);
    tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty));
  };
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===1){ mode=1; moved=false; ox=e.touches[0].clientX-tx; oy=e.touches[0].clientY-ty; }
    else if(e.touches.length>=2){ mode=2; moved=true; d0=dist(e.touches)||1; sc0=sc; }
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(mode===1&&e.touches.length===1){
      const t=e.touches[0], nx=t.clientX-ox, ny=t.clientY-oy;
      if(Math.abs(nx-tx)+Math.abs(ny-ty)>2) moved=true;
      tx=nx; ty=ny;
    }else if(mode===2&&e.touches.length>=2){
      // 下限 .34 = 整张图正好装进竖屏,让人能捏一下看全貌再放大回去看字
      sc=Math.max(.34,Math.min(3, sc0*dist(e.touches)/d0));
    }else return;
    bound(); apply(); e.preventDefault();
    if(!helpEl.classList.contains('gone')) helpEl.classList.add('gone'); // 上手了就不用再提示
  },{passive:false});
  stage.addEventListener('touchend',e=>{ if(!e.touches.length){ mode=0; upAt=Date.now(); }
    else if(e.touches.length===1){ mode=1; ox=e.touches[0].clientX-tx; oy=e.touches[0].clientY-ty; } });
  // 拖过的那一下别当成点地名 —— 否则划两下就被带去别的站
  document.addEventListener('click',e=>{
    if(moved && Date.now()-upAt<420){ e.stopPropagation(); e.preventDefault(); moved=false; }
  },true);
  setTimeout(()=>helpEl.classList.add('gone'), 5200);
}

// initial paint
build();
fetch(NETWORK_API,{headers:{Accept:'application/json'}})
  .then(response=>response.ok?response.json():Promise.reject(new Error('network data unavailable')))
  .then(applyNetworkData)
  .catch(()=>{/* audited local fallback stays visible */});
if(document.visibilityState==='visible'){ bloomIn(); }
else { document.addEventListener('visibilitychange',function once(){ if(document.visibilityState==='visible'){bloomIn();document.removeEventListener('visibilitychange',once);} }); }

// gentle parallax
addEventListener('mousemove',e=>{const mx=(e.clientX/innerWidth-.5),my=(e.clientY/innerHeight-.5);
  layer.style.transform=`translate(${-mx*.8}%,${-my*.8}%)`;});
</script>
</body></html>
